services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinical_dw}
      POSTGRES_USER: ${POSTGRES_USER:-clinical_dw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinical_dw_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinical_dw} -d ${POSTGRES_DB:-clinical_dw}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
